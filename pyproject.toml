[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "name_that_llm"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pyarrow>=26.0.1",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["name_that_llm"]
include = ["pyproject.toml", "name_that_llm/**/*.py"]
# third-party files copied unchanged (their sha256 is checked)
extend-exclude = ["name_that_llm/glm_ll"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["name_that_llm"]
force-sort-within-sections = true

[dependency-groups]
lora = [
    "huggingface-hub>=2.4.0",
    "kagglehub>=1.0.3",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

